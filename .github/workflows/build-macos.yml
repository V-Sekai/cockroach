name: build-macos

on:
  push:
    branches:
      - main
  pull_request:

env:
  NODE_VERSION: 16.20.2

jobs:
  build-arch:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arch: amd64
            makeargs: >-
              XGOOS=darwin XGOARCH=amd64 TARGET_TRIPLE=x86_64-apple-darwin19 XCC=cc XCXX=c++
              EXTRA_XCMAKE_FLAGS=-DCMAKE_OSX_ARCHITECTURES=x86_64
              EXTRA_XCONFIGURE_FLAGS="CFLAGS='-arch x86_64'"
          - arch: arm64
            # Add arm64 makeargs if different from amd64
            makeargs: "" # Placeholder - Define arm64 specific make args if needed
    runs-on: macos-14
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup macOS Toolchain
        uses: ./.github/actions/setup-toolchain # Use the composite action
        with:
          os: macos
          arch: ${{ matrix.arch.arch }}
          node_version: ${{ env.NODE_VERSION }}

      - name: Build macOS (${{ matrix.arch.arch }})
        run: |
          export PATH="$HOME/toolchain/go/bin:$PATH"
          # Updated to use Node.js 16.20.2
          export PATH="$HOME/toolchain/node-v16.20.2-darwin-${{ matrix.arch.arch }}/bin:$PATH"
          export PATH="$HOME/toolchain/go/bin:$HOME/toolchain/node-v16.20.2-darwin-${{ matrix.arch.arch }}/bin:/opt/homebrew/opt/coreutils/libexec/gnubin:/opt/homebrew/opt/make/libexec/gnubin:$PATH"
          export NODE_OPTIONS=--openssl-legacy-provider
          gmake -j`sysctl -n hw.ncpu` cockroachoss BUILDTYPE=release ${{ matrix.arch.makeargs }}
        env:
          BROWSERSLIST_IGNORE_OLD_DATA: 1
          CGO_ENABLED: 1
          MACOSX_DEPLOYMENT_TARGET: 13
          
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ matrix.arch.arch }}
          path: |
            cockroachoss
            lib/libgeos.dylib
            lib/libgeos_c.dylib
          if-no-files-found: error

  build:
    needs: build-arch
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
      - name: Create universal binaries
        run: |
          set -o pipefail
          set -o xtrace
          mkdir -p artifacts/cockroach/lib
          # Ensure downloaded artifacts are in expected amd64/arm64 directories
          # The download action might place them in subdirectories named after the artifact name
          lipo -create -output artifacts/cockroach/cockroach amd64/cockroachoss arm64/cockroachoss
          lipo -create -output artifacts/cockroach/lib/libgeos.dylib amd64/lib/libgeos.dylib arm64/lib/libgeos.dylib
          lipo -create -output artifacts/cockroach/lib/libgeos_c.dylib amd64/lib/libgeos_c.dylib arm64/lib/libgeos_c.dylib
          chmod a+x artifacts/cockroach/{cockroach,lib/*.dylib}
          tar -cvf - -C artifacts cockroach | gzip -9 > cockroach.tgz
          shasum -a 256 cockroach.tgz | awk '{ print $1 }' > cockroach.tgz.sha256
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: build
          path: |
            cockroach.tgz
            cockroach.tgz.sha256
          if-no-files-found: error
          compression-level: 0

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Windows Toolchain
        uses: ./.github/actions/setup-toolchain # Use the composite action
        with:
          os: windows

